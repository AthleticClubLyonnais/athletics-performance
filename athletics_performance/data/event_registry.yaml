  100m:
    world_athletics_id: "100"
    measurement: time
    unit: s
    description: "100 meters sprint"
    french_synonyms:
      - "100m"
      - "100 m"
      - "100 mètres"
      - "100 metres"
    english_synonyms:
      - "100m"
      - "100 meters"
      - "100 metre"

