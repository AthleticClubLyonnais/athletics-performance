# Event Registry: Canonical event definitions with multilingual synonyms
#
# This YAML file defines the canonical event ID for each athletic event,
# along with its synonyms in French and English, measurement type, and metadata.
#
# Used by EventRegistry class to normalize event names from various sources
# (athle.fr, CSV imports, APIs) to canonical event IDs.

