[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "athletics_performance"
authors = [{name = "Guillaume PERRIN - Athletic Club du Lyonnais"}]
dynamic = ["version", "description"]
readme = "README.md"
requires-python = ">=3.13"
keywords = ["Data Science"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pandas>=3.0.1",
    "pypdf2>=3.0.1",
]

[dependency-groups]
dev = [
    "flit>=3.12.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.2",
    "pre-commit",
    "jupyter",
]

doc = [
    "numpydoc>=1.9.0",
    "sphinx>=8.2.3",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-rtd-theme>=1.1.4",
]

[tool.flit.sdist]
include = ["athletics_performance/"]

